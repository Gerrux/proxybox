# Выпуск: тег vX.Y.Z — установщик NSIS в релизе GitHub.
#
# Сборка идёт тем же installer/build.ps1, что и руками: иначе в CI собиралось бы
# не то, что у себя на машине, и расходились бы они молча.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Версию окно берёт из tauri.conf.json и по ней же сравнивает себя со
      # списком релизов. Разъедься тег и версия — установленное приложение
      # считало бы себя устаревшим навсегда.
      - name: тег совпадает с версией
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($conf -ne $tag) { throw "tauri.conf.json = $conf, а тег = $tag" }

      - run: cargo test --workspace

      # pnpm берётся из packageManager в package.json, отдельный action не нужен.
      - run: corepack enable

      # cargo-tauri ставится из исходников, это минуты. Кеш не заводим: релиз
      # собирается по тегу, а не на каждый пуш.
      - run: cargo install tauri-cli --version "^2" --locked

      # sing-box скачает сам sidecars.ps1 — секретов сборке не нужно вовсе.
      # Без -Thumbprint установщик выходит неподписанным: сертификата у проекта
      # нет, а класть в секреты пока нечего.
      - run: pwsh installer/build.ps1

      - name: релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "установщик не собрался" }
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes $exe.FullName
