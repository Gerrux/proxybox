# Выпуск: тег vX.Y.Z — установщики в релизе GitHub, по одному на платформу.
#
# Сборка идёт теми же installer/build.ps1 и installer/build.sh, что и руками:
# иначе в CI собиралось бы не то, что у себя на машине, и расходились бы они
# молча.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Версию окно берёт из tauri.conf.json и по ней же сравнивает себя со
      # списком релизов. Разъедься тег и версия — установленное приложение
      # считало бы себя устаревшим навсегда.
      - name: тег совпадает с версией
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($conf -ne $tag) { throw "tauri.conf.json = $conf, а тег = $tag" }

      # Тот же сторож, что и в ci.yml: без бинарника проверка старта конфига
      # молча пропускается, и релиз уезжает с конфигом, на котором служба
      # падает. Скачанное переиспользует sidecars.ps1 — лишней закачки нет.
      - name: sing-box для сторожей запуска
        run: pwsh installer/get-singbox.ps1

      - run: cargo test --workspace
        env:
          PG_SINGBOX: ${{ github.workspace }}/src-tauri/binaries/sing-box.exe

      # pnpm берётся из packageManager в package.json, отдельный action не нужен.
      - run: corepack enable

      # cargo-tauri ставится из исходников, это минуты. Кеш не заводим: релиз
      # собирается по тегу, а не на каждый пуш.
      - run: cargo install tauri-cli --version "^2" --locked

      # sing-box скачает сам sidecars.ps1 — секретов сборке не нужно вовсе.
      # Без -Thumbprint установщик выходит неподписанным: сертификата у проекта
      # нет, а класть в секреты пока нечего.
      - run: pwsh installer/build.ps1

      - name: релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "установщик не собрался" }
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes $exe.FullName

  # Релиз создаёт windows-job (gh release create); этот только догружает .deb
  # в уже существующий релиз, поэтому ждёт его, а не бежит рядом.
  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Тот же смысл, что и в windows-job, тем же способом: версия
      # tauri.conf.json обязана совпадать с тегом, иначе окно на этой
      # платформе тоже будет считать себя устаревшим сразу после установки.
      - name: тег совпадает с версией
        run: |
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$conf" != "$tag" ]; then
            echo "tauri.conf.json = $conf, а тег = $tag" >&2
            exit 1
          fi

      # libwebkit2gtk и gtk — то же, что и в ci.yml, для сборки окна.
      # libayatana-appindicator3-dev — трей: без него значка в трее нет, но
      # это ещё и требование сборки, а не только рантайма — cargo-tauri сам
      # прибавляет рантайм-зависимость в .deb, зная про неё через pkg-config,
      # и без установленного .pc файла падает с паникой ещё на этапе `cargo
      # tauri build`, до всякого запуска. xvfb и dbus-x11 нужны ниже, для
      # дымового запуска собранного окна без настоящего дисплея.
      - run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev pkg-config xvfb dbus-x11

      # Тот же сторож запуска конфига, что и в ci.yml (validate, linux):
      # версия закреплена в get-singbox.ps1, и CI обязан собирать на той же,
      # что и установщик, иначе он зеленеет на версии, которой ни у кого нет.
      # Скачанное здесь же переиспользует installer/sidecars.sh — он видит
      # готовый бинарник в src-tauri/binaries и не тянет его второй раз.
      - name: sing-box для тестов и сборки
        run: |
          VER=$(grep -oP '\$Version = "\K[^"]+' installer/get-singbox.ps1)
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v$VER/sing-box-$VER-linux-amd64.tar.gz" | tar xz
          mkdir -p src-tauri/binaries
          install "sing-box-$VER-linux-amd64/sing-box" src-tauri/binaries/sing-box
          cp "sing-box-$VER-linux-amd64/LICENSE" src-tauri/binaries/LICENSE-sing-box.txt
          echo "PG_SINGBOX=$PWD/src-tauri/binaries/sing-box" >> "$GITHUB_ENV"

      - run: cargo test --workspace

      # pnpm берётся из packageManager в package.json, отдельный action не нужен.
      - run: corepack enable

      - run: cargo install tauri-cli --version "^2" --locked

      # build.sh собирает --bundles deb явно: bundle.targets в
      # tauri.conf.json общий с Windows ("nsis", "deb"), и хотя
      # tauri-bundler сам отфильтрует nsis по текущей платформе, список
      # целей — не то же самое, что «что мы на самом деле здесь собираем».
      - run: bash installer/build.sh

      # Окно на Linux до сих пор не запускали ни разу — отдать .deb, не
      # проверив, что оно вообще открывается, значит выложить непроверенное.
      # Без настоящего дисплея и сессии D-Bus webkitgtk и трей не встают —
      # xvfb-run и dbus-run-session дают им то, чего они ждут, а не что-то
      # взамен. `timeout` живого процесса убивает его сам и возвращает 124 —
      # это и есть «прожил отведённое», любой другой код значит, что окно
      # упало раньше времени.
      - name: дымовой запуск окна
        env:
          # Без GPU под Xvfb композитор WebKit временами падает ещё на
          # старте — это известная особенность headless-CI, а не что-то
          # специфичное для нас. Отключаем заранее, а не по факту первого
          # красного прогона.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set +e
          dbus-run-session -- xvfb-run -a timeout 20 src-tauri/target/release/pg-desktop
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "окно завершилось само, код $code — упало, а не прожило отведённое время" >&2
            exit 1
          fi
          echo "окно продержалось отведённые 20 секунд"

      - name: догрузить .deb в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null)
          if [ -z "$deb" ]; then
            echo "пакет не собрался" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "$deb"
