[package]
name = "pg-desktop"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

# Отдельный Cargo-проект, не член корневого воркспейса: собирается только на
# Windows (WebView2), на Linux нет webkit2gtk.
[workspace]

[build-dependencies]
tauri-build = "2"

[dependencies]
core-ipc = { path = "../crates/core-ipc" }
# Только ради поиска браузера для «открыть вкладку через профиль»: где что
# установлено, знает каталог core-apps, а не оболочка.
core-apps = { path = "../crates/core-apps" }
# Accept-Language Chromium берёт из Preferences профиля, а не из аргументов, —
# значит оболочке приходится править этот файл. Новой зависимости в дереве это
# не добавляет: serde_json и так тянут и tauri, и core-ipc.
serde_json = "1"
# tray-icon: значок в трее. Без него закрытое окно не оставляет о запертой
# машине ни следа — см. `tray()`.
tauri = { version = "2", features = ["tray-icon"] }
# Второй запуск обязан поднимать уже открытое окно, а не заводить своё: со
# значком в трее спрятанного окна не видно, и по ярлыку жмут именно поэтому.
tauri-plugin-single-instance = "2"
