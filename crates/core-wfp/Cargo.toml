[package]
name = "core-wfp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Отдельный Cargo-проект, не член корневого воркспейса, — по той же причине, что
# и `src-tauri`, только жёстче: это драйвер. Собирается он WDK и линкуется в
# ядро, поэтому `cargo test --workspace` его не трогает и трогать не должен —
# иначе CI на Linux красный там, где кода никто не менял. Корневой Cargo.toml
# держит его в `exclude`.
[workspace]

[lib]
# Драйвер — не обычная библиотека: cdylib даёт PE, который потом переименуют в
# `.sys`. Без этого линковать в ядро нечего.
crate-type = ["cdylib"]

[build-dependencies]
wdk-build = "0.5.1"

[dependencies]
# Безопасных обёрток (`wdk`) тут пока нет намеренно: каркасу они не нужны, а
# зависимость, которая ничего не делает, — это дерево сборки за просто так.
wdk-sys = "0.5.1"
wdk-alloc = "0.5.1"
wdk-panic = "0.5.1"

# Раскрутка стека в ядре не живёт: паника обязана быть abort, иначе драйвер не
# слинкуется вовсе.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
