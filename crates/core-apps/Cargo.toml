[package]
name = "core-apps"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Windows сама знает, что установлено и как оно выглядит: реестр и оболочка.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-icons = "0.4"
# Список процессов: единственный источник, который знает про portable-программы.
windows = { version = "0.62", features = [
    "Win32_System_ProcessStatus",
    # Кто держит локальный порт: GetExtendedTcpTable/GetExtendedUdpTable.
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Threading",
    # Значок окна браузерного сеанса: найти окно процесса и послать ему WM_SETICON.
    "Win32_UI_WindowsAndMessaging",
    # Иконка в панели задач Windows 11: AppUserModelID + SHGetPropertyStoreForWindow
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
